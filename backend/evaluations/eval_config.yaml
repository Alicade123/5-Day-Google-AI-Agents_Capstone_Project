criteria:
  - name: factual_grounding
    description: Facts contain only values derivable from tool outputs
    weight: 2.0
  - name: tool_selection_correctness
    description: Planner selects expected tools for the query intent
    weight: 1.5
  - name: response_completeness
    description: Response includes facts, explanations, confidence, and actions
    weight: 1.0
  - name: hallucination_detection
    description: No numeric claims absent from tool evidence
    weight: 2.0
  - name: latency
    description: Response within acceptable time budget
    weight: 0.5

thresholds:
  pass_score: 0.75
  max_latency_ms: 30000
